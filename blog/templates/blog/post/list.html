<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>

    <h1>My Blog</h1>

    {% for post in posts %}
        <h2>{{ post.title }}</h2>
        <p>{{ post.body }}</p>
        <small>Published: {{ post.publish }}</small>
        <hr>
    {% empty %}
        <p>No published posts yet.</p>
    {% endfor %}

</body>
</html>
